name: QueryBridge Python Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py
      - name: Flask import and database smoke test
        run: |
          python - <<'PY'
          import app
          app.init_db()
          rules = sorted(str(rule) for rule in app.app.url_map.iter_rules())
          print("\n".join(rules))
          assert "/llm" in rules
          assert "/knowledge" in rules
          assert "/chat" in rules
          assert "/api/chat" in rules
          PY
