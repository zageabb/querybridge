name: QueryBridge Python Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py
      - name: Flask import and database smoke test
        run: |
          python - <<'PY'
          import app
          app.init_db()
          rules = sorted(str(rule) for rule in app.app.url_map.iter_rules())
          print("\n".join(rules))
          with app.app.test_request_context():
              from flask import url_for
              assert url_for("builder") == "/builder"
          assert "/llm" in rules
          assert "/knowledge" in rules
          assert "/knowledge/import-pack" in rules
          assert "/chat" in rules
          assert "/builder" in rules
          assert "/relationships/clear-auto" in rules
          assert "/relationships/auto-inference" in rules
          assert "/api/chat" in rules
          assert "/schema/proposals/create" in rules
          assert app.normalise_ai_operation({"action":"add_link"})["action"] == "add_relationship"
          assert app.normalise_ai_operation({"operation":"add_column","table":"T","column":"C","type":"STRING"})["action"] == "add_field"
          nested = app.normalise_ai_operation({"add_relationship":{"left_table":"A","left_column":"ID","right_table":"B","right_column":"AID"}})
          assert nested["action"] == "add_relationship"
          assert nested["left_table"] == "A"
          assert "/ai-skills" in rules
          assert "/api/markdown/render" in rules
          assert "/knowledge/<int:item_id>" in rules
          conn = app.db()
          local_result = app.execute_local_schema_select(conn, "SELECT COUNT(*) AS n FROM schema_tables")
          assert local_result["columns"] == ["n"]
          assert local_result["row_count"] == 1
          try:
              app.execute_local_schema_select(conn, "UPDATE schema_tables SET table_name='x'")
              raise AssertionError("write query should have been rejected")
          except ValueError:
              pass
          skill = conn.execute("SELECT 1 FROM qb_ai_skills WHERE skill_key='local-schema-sql-analysis' AND enabled=1").fetchone()
          assert skill is not None

          conn.execute("DELETE FROM qb_relationships")
          conn.execute("DELETE FROM qb_columns")
          conn.execute("DELETE FROM qb_tables")
          conn.execute(
              "INSERT INTO qb_tables(catalog,schema_name,table_name,table_type,is_temporary,raw_source,captured_at) VALUES (?,?,?,?,?,?,?)",
              ("maincat","scm","projects","TABLE",0,"test",app.now_iso()),
          )
          project_id = conn.execute("SELECT id FROM qb_tables WHERE table_name='projects'").fetchone()["id"]
          conn.execute(
              "INSERT INTO qb_tables(catalog,schema_name,table_name,table_type,is_temporary,raw_source,captured_at) VALUES (?,?,?,?,?,?,?)",
              ("maincat","scm","orders","TABLE",0,"test",app.now_iso()),
          )
          order_id = conn.execute("SELECT id FROM qb_tables WHERE table_name='orders'").fetchone()["id"]
          conn.execute(
              "INSERT INTO qb_columns(table_id,ordinal_position,column_name,data_type,nullable,comment,raw_json) VALUES (?,?,?,?,?,?,?)",
              (project_id,1,"project_id","STRING",0,None,None),
          )
          conn.execute(
              "INSERT INTO qb_columns(table_id,ordinal_position,column_name,data_type,nullable,comment,raw_json) VALUES (?,?,?,?,?,?,?)",
              (project_id,2,"project_name","STRING",1,None,None),
          )
          conn.execute(
              "INSERT INTO qb_columns(table_id,ordinal_position,column_name,data_type,nullable,comment,raw_json) VALUES (?,?,?,?,?,?,?)",
              (order_id,1,"project_id","STRING",0,None,None),
          )
          conn.execute(
              "INSERT INTO qb_columns(table_id,ordinal_position,column_name,data_type,nullable,comment,raw_json) VALUES (?,?,?,?,?,?,?)",
              (order_id,2,"po_number","STRING",1,None,None),
          )
          conn.commit()

          imported = app.parse_databricks_query_to_builder(
              conn,
              """SELECT p.project_name, o.po_number
                 FROM maincat.scm.projects p
                 INNER JOIN maincat.scm.orders o
                   ON p.project_id = o.project_id
                 WHERE o.po_number IS NOT NULL
                 ORDER BY p.project_name"""
          )
          assert len(imported["fields"]) == 2
          assert all(item["kind"] == "field" for item in imported["fields"])
          assert imported["state"]["modifiers"]["where"].upper().startswith("WHERE")
          assert imported["state"]["modifiers"]["order"].upper().startswith("ORDER BY")
          assert len(imported["relationship_candidates"]) == 1
          assert len(imported["state"]["joins"]) == 1
          assert len(imported["state"]["criteria"]) == 1

          complex_shape = app.parse_databricks_query_to_builder(
              conn,
              """SELECT
                     t1.ID AS Project_ID,
                     t1.Number AS Project_Number,
                     t1.Created AS Project_Created,
                     t1.Name AS Project_Name,
                     t2.Name AS LUI_Name
                 FROM edp_scm.scmcockpit.pp_projects AS t1
                 INNER JOIN edp_scm.scmcockpit.pp_localuserislands AS t2
                   ON t2.ID = t1.LocalUserIslandID
                 INNER JOIN edp_scm.scmcockpit.pp_requestforrequestforquotations AS qb1
                   ON qb1.ProjectID = t1.ID
                 INNER JOIN edp_scm.scmcockpit.pp_requestforrequestforquotationstatuses AS qb2
                   ON qb2.Process_Id = t2.Process_Id
                 WHERE t1.IsInactive = FALSE
                   AND t1.IsDeleted = FALSE
                   AND qb1.Created > '2021-09-01'"""
          )
          assert len(complex_shape["state"]["sources"]) == 4
          assert len(complex_shape["state"]["joins"]) == 3
          assert len(complex_shape["state"]["criteria"]) == 3

          setting = conn.execute(
              "SELECT auto_inference_enabled FROM qb_relationship_settings WHERE id=1"
          ).fetchone()
          assert setting is not None
          assert setting["auto_inference_enabled"] == 0

          # Auto inference is off by default and must not create heuristic links.
          created = app.infer_relationships(conn)
          assert created == 0, "auto relationship should stay disabled"
          assert conn.execute(
              "SELECT COUNT(*) n FROM qb_relationships WHERE source='auto'"
          ).fetchone()["n"] == 0

          rebuilt, warnings = app.build_sql_from_imported_state(
              conn,
              imported["fields"],
              imported["state"],
          )
          assert "INNER JOIN" in rebuilt.upper()
          assert "WHERE" in rebuilt.upper()
          assert "ORDER BY" in rebuilt.upper()
          assert "PROJECT_NAME" in rebuilt.upper()

          manual_fields = [dict(item) for item in imported["fields"]]
          manual_fields[0]["output_alias"] = "Project_Name"
          manual_alias_sql, manual_warnings = app.build_sql_from_imported_state(
              conn,
              manual_fields,
              imported["state"],
              {
                  str(project_id): "project",
                  str(order_id): "po",
              },
          )
          assert "PROJECT_NAME" in manual_alias_sql.upper()
          assert "AS `Project_Name`".upper() in manual_alias_sql.upper()
          assert "PROJECT.PROJECT_ID" in manual_alias_sql.replace("`", "").upper()
          assert "PO.PROJECT_ID" in manual_alias_sql.replace("`", "").upper()

          # Explicitly generate one heuristic link, then prove provenance cleanup
          # can remove it without touching an approved AI link.
          generated = app.infer_relationships(conn, force=True)
          assert generated >= 1
          first_auto = conn.execute(
              "SELECT * FROM qb_relationships WHERE source='auto' LIMIT 1"
          ).fetchone()
          assert first_auto is not None

          conn.execute(
              """
              UPDATE qb_relationships
              SET source='ai-approved', notes='test approved relationship'
              WHERE id=?
              """,
              (first_auto["id"],),
          )
          conn.execute(
              """
              INSERT OR IGNORE INTO qb_relationships
              (left_table_id,left_column_id,right_table_id,right_column_id,confidence,source,notes)
              VALUES (?,?,?,?,?,'auto','test old heuristic')
              """,
              (
                  order_id,
                  conn.execute("SELECT id FROM qb_columns WHERE table_id=? AND column_name='po_number'", (order_id,)).fetchone()["id"],
                  project_id,
                  conn.execute("SELECT id FROM qb_columns WHERE table_id=? AND column_name='project_name'", (project_id,)).fetchone()["id"],
                  0.5,
              ),
          )
          conn.commit()

          auto_before = conn.execute(
              "SELECT COUNT(*) n FROM qb_relationships WHERE source='auto'"
          ).fetchone()["n"]
          approved_before = conn.execute(
              "SELECT COUNT(*) n FROM qb_relationships WHERE source='ai-approved'"
          ).fetchone()["n"]
          assert auto_before >= 1
          assert approved_before >= 1

          conn.execute("DELETE FROM qb_relationships WHERE source='auto'")
          conn.commit()
          assert conn.execute(
              "SELECT COUNT(*) n FROM qb_relationships WHERE source='auto'"
          ).fetchone()["n"] == 0
          assert conn.execute(
              "SELECT COUNT(*) n FROM qb_relationships WHERE source='ai-approved'"
          ).fetchone()["n"] == approved_before
          assert app.infer_relationships(conn) == 0
          assert conn.execute(
              "SELECT COUNT(*) n FROM qb_relationships WHERE source='auto'"
          ).fetchone()["n"] == 0

          conn.close()
          PY
